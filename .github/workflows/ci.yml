name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Serves a fake release locally and runs install.ps1 the way users do (irm | iex),
      # under both PowerShell 7 and Windows PowerShell 5.1.
      - name: install.ps1
        shell: pwsh
        run: |
          New-Item -ItemType Directory rel | Out-Null
          go build -o keel.exe ./cmd/keel
          Compress-Archive keel.exe rel/keel_windows_amd64.zip
          $hash = (Get-FileHash rel/keel_windows_amd64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  keel_windows_amd64.zip" | Set-Content rel/checksums.txt
          Copy-Item install.ps1 rel/
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'rel' -PassThru
          Start-Sleep 2
          $env:KEEL_BASE_URL = 'http://127.0.0.1:8765'

          function Assert-Installed($dir) {
            $userPath = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
            if (($userPath -split ';') -notcontains $dir) { throw "user Path missing ${dir}: $userPath" }
            & "$dir\keel.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "keel.exe --version failed in $dir" }
          }

          irm http://127.0.0.1:8765/install.ps1 | iex
          Assert-Installed (Join-Path $env:LOCALAPPDATA 'Programs\keel')

          $env:KEEL_INSTALL_DIR = 'C:\keel-ps51'
          powershell -NoProfile -Command 'irm http://127.0.0.1:8765/install.ps1 | iex'
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed under Windows PowerShell 5.1' }
          Assert-Installed 'C:\keel-ps51'

          Stop-Process $server
